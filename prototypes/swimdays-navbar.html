<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swimdays Navbar Prototype</title>
    
    <style>
        /* 
         =============================================
         PROTOTYPE CSS 
         (Will be moved to assets/swimdays-header.css)
         =============================================
        */
        
        /* Basic reset for the prototype */
        @font-face {
            font-family: 'Poppins';
            src: url('../swimdays-theme/assets/Poppins-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('../swimdays-theme/assets/Poppins-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('../swimdays-theme/assets/Poppins-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('../swimdays-theme/assets/Poppins-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --nav-height: clamp(68px, 8vw, 80px);
            --nav-height-scrolled: clamp(60px, 7vw, 64px);
            --nav-inline-padding: clamp(18px, 4vw, 40px);
            --nav-link-gap: clamp(24px, 3vw, 40px);
            --nav-foreground: #111;
            --nav-icon-filter: none;
            --nav-panel-bg: rgba(252, 252, 250, 0.94);
            --nav-border: rgba(17, 17, 17, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif; /* Fallback styling */
            height: 3000px; /* Force scrolling to test GSAP */
            background: #fafafa;
        }

        body.nav-locked {
            overflow: hidden;
        }

        .swimdays-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: transparent;
            z-index: 1000;
            container-type: inline-size;
            container-name: navbar;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .swimdays-navbar::before {
            content: '';
            position: absolute;
            inset: 0 0 -32px;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            mask-image: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.98) 0%,
                rgba(0, 0, 0, 0.94) 54%,
                rgba(0, 0, 0, 0.55) 78%,
                transparent 100%
            );
            -webkit-mask-image: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.98) 0%,
                rgba(0, 0, 0, 0.94) 54%,
                rgba(0, 0, 0, 0.55) 78%,
                transparent 100%
            );
            pointer-events: none;
            transition: background 0.4s ease, backdrop-filter 0.4s ease, -webkit-backdrop-filter 0.4s ease;
        }

        .swimdays-navbar.is-scrolled {
            height: var(--nav-height-scrolled);
        }

        .swimdays-navbar.is-scrolled::before,
        .swimdays-navbar.menu-open::before {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px) saturate(170%);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
        }

        .navbar-inner {
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            padding: 0 var(--nav-inline-padding);
            box-sizing: border-box;
            position: relative;
            gap: 16px;
        }

        .navbar-left {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            min-width: 0;
            gap: 14px;
        }

        .navbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            pointer-events: none;
            max-width: calc(100% - 208px);
        }

        .navbar-center a {
            display: inline-flex;
            pointer-events: auto;
        }

        .navbar-center img {
            height: clamp(24px, 4vw, 28px);
            max-width: min(170px, 42vw);
            width: auto;
            display: block;
            cursor: pointer;
            filter: var(--nav-icon-filter);
            transition: filter 0.25s ease;
        }

        .navbar-right {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            align-items: center;
            margin-left: auto;
        }

        .navbar-primary-nav {
            min-width: 0;
            display: none;
        }

        .navbar-mobile-actions {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }

        .navbar-links {
            display: flex;
            gap: var(--nav-link-gap);
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .navbar-links > li {
            position: relative;
        }

        .navbar-links > li > a,
        .mobile-menu a,
        .mobile-menu summary,
        .mobile-utility-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            color: var(--nav-foreground);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.25s ease;
        }

        .navbar-links > li > a {
            position: relative;
            padding-bottom: 4px;
        }

        .nav-dropdown-caret {
            width: 10px;
            height: 10px;
            flex: 0 0 auto;
        }

        .navbar-links > li > a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--nav-foreground);
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .navbar-links > li > a:hover::after {
            width: 100%;
        }

        .has-dropdown {
            padding-bottom: 20px;
            margin-bottom: -20px;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #fff;
            list-style: none;
            margin: 0;
            padding: 16px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.3s;
        }

        .has-dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu a {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            color: #666;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .dropdown-menu a:hover {
            color: #000;
        }

        .navbar-icon-button,
        .navbar-toggle,
        .badge-wrapper,
        .mobile-menu-close {
            border: 0;
            background: transparent;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            appearance: none;
        }

        .navbar-toggle {
            width: 24px;
            height: 24px;
        }

        .navbar-toggle svg {
            width: 100%;
            height: 100%;
            stroke: var(--nav-foreground);
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .navbar-icon {
            width: 22px;
            height: 22px;
            display: block;
            filter: var(--nav-icon-filter);
            transition: opacity 0.2s ease, transform 0.2s ease, filter 0.25s ease;
        }

        .navbar-icon-button:hover .navbar-icon,
        .badge-wrapper:hover .navbar-icon,
        .navbar-toggle:hover svg {
            opacity: 0.6;
            transform: scale(1.05);
        }

        .badge-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .icon-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: transparent;
            color: var(--nav-foreground);
            border: 1px solid var(--nav-foreground);
            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            font-weight: 600;
            height: 16px;
            min-width: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            padding: 0 4px;
            box-sizing: border-box;
            letter-spacing: 0;
            transition: color 0.25s ease, border-color 0.25s ease;
        }

        .desktop-only {
            display: none;
        }

        .mobile-menu {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: flex-start;
            padding: 0;
            background: rgba(12, 17, 24, 0.24);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.28s ease, visibility 0.28s ease;
            box-sizing: border-box;
        }

        .swimdays-navbar.menu-open .mobile-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .mobile-menu-inner {
            width: min(86vw, 380px);
            max-width: 100%;
            height: 100dvh;
            padding: calc(var(--nav-height) + 20px) 24px 32px;
            border-right: 1px solid var(--nav-border);
            border-radius: 0 28px 28px 0;
            background:
                linear-gradient(180deg, rgba(247, 246, 242, 0.98) 0%, rgba(255, 255, 255, 0.96) 100%);
            box-shadow: 18px 0 64px rgba(17, 17, 17, 0.14);
            transform: translateX(calc(-100% - 24px));
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .swimdays-navbar.menu-open .mobile-menu-inner {
            transform: translateX(0);
        }

        .mobile-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .mobile-menu-header p {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(17, 17, 17, 0.6);
        }

        .mobile-menu-close {
            width: 28px;
            height: 28px;
            font-size: 28px;
            line-height: 1;
            color: var(--nav-foreground);
        }

        .mobile-menu-list,
        .mobile-submenu,
        .mobile-utility-links {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .mobile-menu-list {
            display: grid;
            gap: 18px;
        }

        .mobile-menu-list > li,
        .mobile-utility-links li {
            border-bottom: 1px solid rgba(17, 17, 17, 0.08);
            padding-bottom: 18px;
        }

        .mobile-menu-list > li:last-child,
        .mobile-utility-links li:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .mobile-menu details[open] summary {
            margin-bottom: 14px;
        }

        .mobile-menu summary {
            list-style: none;
            cursor: pointer;
        }

        .mobile-menu summary::-webkit-details-marker {
            display: none;
        }

        .mobile-submenu {
            display: grid;
            gap: 12px;
            padding-left: 4px;
        }

        .mobile-submenu a {
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(17, 17, 17, 0.66);
        }

        .mobile-utility-links {
            margin-top: 32px;
            display: grid;
            gap: 18px;
        }

        .mobile-utility-link {
            justify-content: space-between;
            width: 100%;
        }

        @container navbar (min-width: 960px) {
            .navbar-inner {
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                gap: 24px;
            }

            .navbar-left {
                gap: 0;
            }

            .navbar-center {
                position: static;
                transform: none;
                max-width: none;
            }

            .navbar-right {
                gap: 24px;
            }

            .navbar-mobile-actions,
            .mobile-menu {
                display: none;
            }

            .navbar-primary-nav {
                display: block;
            }

            .desktop-only {
                display: inline-flex;
            }
        }

        /* Fake content for scrolling effect demonstration */
        .hero-section {
            height: 100vh;
            min-height: 800px;
            background:
                radial-gradient(circle at top, rgba(164, 208, 222, 0.55) 0%, rgba(164, 208, 222, 0) 38%),
                linear-gradient(135deg, #f5f0e6 0%, #e4f3f5 42%, #f8fbfd 100%),
                linear-gradient(
                    to bottom,
                    rgba(7, 15, 24, 0.18) 0%,
                    rgba(7, 15, 24, 0.1) 22%,
                    rgba(7, 15, 24, 0.28) 100%
                );
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.92);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 24px 64px;
            box-sizing: border-box;
            text-align: center;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }
    </style>
</head>
<body>

    <!-- 
      =============================================
      HTML STRUCTURE
      (Will be moved to sections/swimdays-header.liquid)
      =============================================
    -->
    <header class="swimdays-navbar">
        <div class="navbar-inner">
            
            <div class="navbar-left">
                <div class="navbar-mobile-actions">
                    <button class="navbar-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M4 7H20" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M4 12H20" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M9 17H20" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>

                    <button class="navbar-icon-button" type="button" aria-label="Search">
                        <img class="navbar-icon" src="../swimdays-theme/assets/icon-search.svg" alt="">
                    </button>
                </div>

                <nav class="navbar-primary-nav" aria-label="Primary">
                    <ul class="navbar-links">
                        <li class="has-dropdown">
                            <a href="#">
                                <span>Collections</span>
                                <svg class="nav-dropdown-caret" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a href="#">Moss</a></li>
                                <li><a href="#">Cove</a></li>
                                <li><a href="#">View All</a></li>
                            </ul>
                        </li>
                        <li><a href="#">About Us</a></li>
                        <li><a href="#">Blogs</a></li>
                    </ul>
                </nav>
            </div>

            <div class="navbar-center">
                <a href="#" aria-label="Swimdays home">
                    <img src="../swimdays-theme/assets/swimdays_logo.svg" alt="Swimdays Logo">
                </a>
            </div>

            <div class="navbar-right">
                <button class="navbar-icon-button desktop-only" type="button" aria-label="Search">
                    <img class="navbar-icon" src="../swimdays-theme/assets/icon-search.svg" alt="">
                </button>

                <button class="navbar-icon-button" type="button" aria-label="Account">
                    <img class="navbar-icon" src="../swimdays-theme/assets/icon-account.svg" alt="">
                </button>
                
                <button class="badge-wrapper" type="button" aria-label="Cart with 2 items">
                    <img class="navbar-icon" src="../swimdays-theme/assets/icon-cart.svg" alt="">
                    <span class="icon-badge">2</span>
                </button>
            </div>

            <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
                <div class="mobile-menu-inner">
                    <div class="mobile-menu-header">
                        <p>Browse</p>
                        <button class="mobile-menu-close" type="button" aria-label="Close menu">&times;</button>
                    </div>

                    <ul class="mobile-menu-list">
                        <li>
                            <details open>
                                <summary>Collections</summary>
                                <ul class="mobile-submenu">
                                    <li><a href="#">Moss</a></li>
                                    <li><a href="#">Cove</a></li>
                                    <li><a href="#">View All</a></li>
                                </ul>
                            </details>
                        </li>
                        <li><a href="#">About Us</a></li>
                        <li><a href="#">Blogs</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <div class="hero-section">Scroll Down To Test Smart Sticky Nav ↓</div>

    <!-- 
      =============================================
      JAVASCRIPT (GSAP & Scroll Logic)
      =============================================
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const navbar = document.querySelector('.swimdays-navbar');
            const menuToggle = document.querySelector('.navbar-toggle');
            const menuClose = document.querySelector('.mobile-menu-close');
            const mobileMenu = document.querySelector('.mobile-menu');
            const mobileMenuLinks = document.querySelectorAll('.mobile-menu a');
            const desktopViewport = window.matchMedia('(min-width: 960px)');

            const setMenuState = (isOpen) => {
                navbar.classList.toggle('menu-open', isOpen);
                document.body.classList.toggle('nav-locked', isOpen);
                menuToggle.setAttribute('aria-expanded', String(isOpen));
                mobileMenu.setAttribute('aria-hidden', String(!isOpen));
            };

            // We use ScrollTrigger to create a highly optimized scroll listener
            // rather than a manual window.addEventListener('scroll')
            ScrollTrigger.create({
                start: 'top -50', // Trigger after scrolling down 50px
                end: 99999, // Keep active essentially forever
                onUpdate: (self) => {
                    // Add shadow and shrink slightly if we are not at the very top of the page
                    if (self.progress > 0 && window.scrollY > 20) {
                        navbar.classList.add('is-scrolled');
                    } else {
                        navbar.classList.remove('is-scrolled');
                    }
                }
            });

            menuToggle.addEventListener('click', () => {
                const isOpen = navbar.classList.contains('menu-open');
                setMenuState(!isOpen);
            });

            menuClose.addEventListener('click', () => {
                setMenuState(false);
            });

            mobileMenuLinks.forEach((link) => {
                link.addEventListener('click', () => {
                    setMenuState(false);
                });
            });

            mobileMenu.addEventListener('click', (event) => {
                if (event.target === mobileMenu) {
                    setMenuState(false);
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && navbar.classList.contains('menu-open')) {
                    setMenuState(false);
                }
            });

            desktopViewport.addEventListener('change', (event) => {
                if (event.matches) {
                    setMenuState(false);
                }
            });
        });
    </script>
</body>
</html>
